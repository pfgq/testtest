name: Build kernel (lmi ksu)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TZ: Asia/Tokyo
      CCACHE_DIR: /home/runner/.cache/ccache_mikernel
      TOOLCHAIN_DIR: /home/runner/zyc-clang
      TOOLCHAIN_BIN: /home/runner/zyc-clang/bin

      TARGET_DEVICE: lmi
      BUILD_VARIANT: ksu   # 为空则不带 ksu，例如: ""

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ApartTUSITU/kernel_xiaomi_sm8250_mod
          ref: android16-aptusitu
          fetch-depth: 1
          filter: blob:none
          submodules: false
          lfs: false

      - name: Install dependencies
        run: |
          set -euxo pipefail
      
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex g++ gcc git gperf \
            libelf-dev libssl-dev lld llvm make ninja-build \
            openssl pahole python3 python3-pip rsync unzip zip \
            zlib1g-dev libncurses-dev wget ca-certificates xz-utils zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            curl

      - name: Cache zyc-clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/zyc-clang
          key: zyc-clang-15.0.7-20251111-${{ runner.os }}

      - name: Get zyc-clang toolchain (robust)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd /home/runner
          url="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz"
          fname="Clang-15.0.7-20251111.tar.gz"
          wget -q --show-progress "$url" -O "$fname"
          file "$fname"
          gzip -t "$fname"

          clang_entry="$(tar -tzf "$fname" | grep -E '(^|/)(bin/clang|bin/clang-[0-9]+|bin/clang\.real)$' | head -n1 || true)"
          if [ -z "$clang_entry" ]; then
            echo "ERROR: cannot find clang entry in tar list."
            tar -tzf "$fname" | head -n 120
            exit 1
          fi
          echo "Found clang entry: $clang_entry"

          rm -rf /home/runner/zyc-tmp
          mkdir -p /home/runner/zyc-tmp
          tar -xzf "$fname" -C /home/runner/zyc-tmp

          root_subdir="$(echo "$clang_entry" | sed -E 's#(^|/)?bin/clang([./-].*)?$##')"
          root_subdir="${root_subdir%/}"
          if [ -z "$root_subdir" ]; then
            src_root="/home/runner/zyc-tmp"
          else
            src_root="/home/runner/zyc-tmp/$root_subdir"
          fi

          rm -rf "${TOOLCHAIN_DIR}"
          mkdir -p "${TOOLCHAIN_DIR}"
          rsync -a "$src_root"/ "${TOOLCHAIN_DIR}"/

          if [ ! -e "${TOOLCHAIN_BIN}/clang" ]; then
            alt="$(ls -1 ${TOOLCHAIN_BIN}/clang-* 2>/dev/null | head -n1 || true)"
            if [ -n "$alt" ]; then
              ln -sf "$(basename "$alt")" "${TOOLCHAIN_BIN}/clang"
            fi
          fi

          "${TOOLCHAIN_BIN}/clang" --version

      - name: Add toolchain to PATH
        run: |
          set -euxo pipefail
          echo "${TOOLCHAIN_BIN}" >> $GITHUB_PATH

      # ✅ 替换：不再运行 ./build.sh
      - name: Build
        run: |
          set -euxo pipefail

          echo "TARGET_DEVICE=${TARGET_DEVICE}"
          echo "BUILD_VARIANT=${BUILD_VARIANT}"
          clang --version || true
          ccache -s || true

          # 1) 注入 qudong / khack（只拉取 + 修改 Makefile/Kconfig）
          curl -LSs "https://raw.githubusercontent.com/pfgq/qudong/refs/heads/main/kernel/setup.sh" | bash

          # 2) 找 defconfig
          DEFCONFIG=""
          for f in \
            arch/arm64/configs/${TARGET_DEVICE}_defconfig \
            arch/arm64/configs/vendor/${TARGET_DEVICE}_defconfig \
            arch/arm64/configs/vendor/xiaomi/${TARGET_DEVICE}_defconfig
          do
            if [ -f "$f" ]; then
              DEFCONFIG="$(basename "$f")"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="$(ls arch/arm64/configs | grep -i ${TARGET_DEVICE} | head -n1 || true)"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: defconfig for ${TARGET_DEVICE} not found"
            ls arch/arm64/configs | sed -n '1,200p'
            exit 1
          fi

          echo "Using DEFCONFIG=${DEFCONFIG}"

          # 3) 配置 + 只编译 drivers/khack
          export ARCH=arm64
          export O=out
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p "${O}"

          make -j$(nproc) O="${O}" "${DEFCONFIG}"
          scripts/config --file "${O}/.config" -e CONFIG_KERNEL_HACK || true
          make -j$(nproc) O="${O}" olddefconfig
          make -j$(nproc) O="${O}" prepare
          make -j$(nproc) O="${O}" modules_prepare


          # 关键：只编译 khack 目录（不会构建全量 modules）
          make -j$(nproc) O="${O}" M=drivers/khack modules

          # 可选：把 khack 的 .ko 装到 staging，方便打包（只装它）
          rm -rf "${O}/khack_staging"
          mkdir -p "${O}/khack_staging"
          find "${O}" -type f -name "*.ko" -path "*/drivers/khack/*" -print -exec cp -f {} "${O}/khack_staging/" \;

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_DEVICE }}-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: out/khack_staging/*
          if-no-files-found: warn
          retention-days: 7
