name: Build ReSukiSU module (lmi 4.19)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Tokyo
      TOOLCHAIN_DIR: /home/runner/zyc-clang
      CCACHE_DIR: /home/runner/.cache/ccache_ksu
      CCACHE_MAXSIZE: 5G
      TOOLCHAIN_BIN: /home/runner/zyc-clang/bin
      TARGET_DEVICE: lmi

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ApartTUSITU/kernel_xiaomi_sm8250_mod
          ref: android16-aptusitu
          fetch-depth: 1
          filter: blob:none
          submodules: false

      - name: Checkout hook patcher
        uses: actions/checkout@v4
        with:
          repository: pfgq/testtest
          path: cisrc
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex g++ gcc git gperf \
            libelf-dev libssl-dev lld llvm make ninja-build \
            openssl pahole python3 python3-pip rsync unzip zip \
            zlib1g-dev libncurses-dev wget ca-certificates xz-utils zstd \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi curl

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache_ksu
          key: ccache-ksu-${{ github.sha }}
          restore-keys: |
            ccache-ksu-

      - name: Get clang toolchain
        run: |
          set -euxo pipefail
          cd /home/runner
          url="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz"
          fname="Clang-15.0.7-20251111.tar.gz"
          wget -q --show-progress "$url" -O "$fname"
          file "$fname"
          gzip -t "$fname"

          clang_entry="$(tar -tzf "$fname" | grep -E '(^|/)(bin/clang|bin/clang-[0-9]+|bin/clang\.real)$' | head -n1 || true)"
          if [ -z "$clang_entry" ]; then
            echo "ERROR: cannot find clang entry in tar list."
            tar -tzf "$fname" | head -n 60
            exit 1
          fi
          echo "Found clang entry: $clang_entry"

          rm -rf /home/runner/zyc-tmp
          mkdir -p /home/runner/zyc-tmp
          tar -xzf "$fname" -C /home/runner/zyc-tmp

          root_subdir="$(echo "$clang_entry" | sed -E 's#(^|/)?bin/clang([./-].*)?$##')"
          root_subdir="${root_subdir%/}"
          if [ -z "$root_subdir" ]; then
            src_root="/home/runner/zyc-tmp"
          else
            src_root="/home/runner/zyc-tmp/$root_subdir"
          fi

          rm -rf "${TOOLCHAIN_DIR}"
          mkdir -p "${TOOLCHAIN_DIR}"
          rsync -a "$src_root"/ "${TOOLCHAIN_DIR}"/

          if [ ! -e "${TOOLCHAIN_BIN}/clang" ]; then
            alt="$(ls -1 ${TOOLCHAIN_BIN}/clang-* 2>/dev/null | head -n1 || true)"
            if [ -n "$alt" ]; then
              ln -sf "$(basename "$alt")" "${TOOLCHAIN_BIN}/clang"
            fi
          fi

          "${TOOLCHAIN_BIN}/clang" --version

      - name: Fetch ReSukiSU kernel module
        run: |
          set -euxo pipefail
          # BakaSU's Kbuild refuses to build unless the source sits in a git
          # checkout: it tests for $(KSU_SRC)/../.git.  So clone the whole
          # repo under drivers/ instead of copying kernel/ out of it.
          rm -rf drivers/BakaSU
          git clone --depth 1 https://github.com/Baka-SU/BakaSU drivers/BakaSU
          grep -q 'BakaSU/kernel' drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += BakaSU/kernel/' >> drivers/Makefile
          grep -q 'BakaSU/kernel/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/BakaSU/kernel/Kconfig"' drivers/Kconfig
          # The kernel tree already ships a full KSU+SUSFS integration whose
          # hook signatures match BakaSU, so no hook patching is needed.
          # Only fs/read_write.c is overlaid: it carries ksu_vfs_read_hook,
          # which BakaSU rejects as incompatible (and which no longer has a
          # provider in the module).
          # M= builds only see obj-m; BakaSU declares obj-$(CONFIG_KSU)
          # (=y) so nothing would be built otherwise.
          sed -i 's/^obj-$(CONFIG_KSU) += kernelsu\.o/obj-m += kernelsu.o/' \
            drivers/BakaSU/kernel/Kbuild
          grep -n '^obj-' drivers/BakaSU/kernel/Kbuild

          cp -v cisrc/ci/overlay/fs/read_write.c fs/read_write.c
          cp -v cisrc/ci/overlay/fs/stat.c       fs/stat.c
          ls drivers/BakaSU | head

      - name: Configure
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_BIN}:$PATH"
          DEFCONFIG=""
          for f in \
            arch/arm64/configs/${TARGET_DEVICE}_defconfig \
            arch/arm64/configs/vendor/${TARGET_DEVICE}_defconfig \
            arch/arm64/configs/vendor/xiaomi/${TARGET_DEVICE}_defconfig
          do
            [ -f "$f" ] && DEFCONFIG="$(basename "$f")" && break
          done
          echo "defconfig=$DEFCONFIG"
          make O=out ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -d CONFIG_KSU_KPROBES_HOOK \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -d CONFIG_INIT_STACK_ALL_ZERO \
            -d CONFIG_INIT_STACK_ALL_PATTERN || true
          make O=out ARCH=arm64 olddefconfig
          grep -E 'CONFIG_KSU' out/.config

      - name: Build (module only, no vmlinux)
        run: |
          set -euxo pipefail
          export PATH="${TOOLCHAIN_BIN}:$PATH"
          ccache --max-size=5G
          ccache --zero-stats

          TOOL_ARGS="CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # modules_prepare: generates include/generated AND builds scripts/mod/modpost
          make -j"$(nproc)" O=out ARCH=arm64 ${TOOL_ARGS} modules_prepare 2>&1 | tail -20

          # flask.h / av_permissions.h are generated by the host tool
          # scripts/selinux/genheaders during a normal kernel build.
          # modules_prepare does not build it, and `make <header>` is not a
          # visible target in the sub-make, so build the tool and run it.
          make -j"$(nproc)" O=out ARCH=arm64 scripts/selinux/genheaders 2>&1 | tail -5
          mkdir -p out/security/selinux
          out/scripts/selinux/genheaders/genheaders \
            out/security/selinux/flask.h out/security/selinux/av_permissions.h
          ls -l out/security/selinux/flask.h out/security/selinux/av_permissions.h

          # just the module tree
          make -j"$(nproc)" O=out ARCH=arm64 ${TOOL_ARGS} M=drivers/BakaSU/kernel modules 2>&1 | tail -40

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Collect module
        run: |
          set -euxo pipefail
          find . -name 'kernelsu.ko' 2>/dev/null | head -5
          KO="$(find . -name 'kernelsu.ko' 2>/dev/null | head -n1)"
          cp "$KO" ./kernelsu-4.19.113.ko
          ls -l ./kernelsu-4.19.113.ko
          strings ./kernelsu-4.19.113.ko | grep vermagic

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksu-ci
          files: kernelsu-4.19.113.ko
